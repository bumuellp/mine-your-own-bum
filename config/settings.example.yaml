---
server:
  server_type: "cax21"
  fallback_server_types: # Waterfall fallback if primary type is unavailable in location (cheapest to most available)
    - "cax31"
    - "cpx32"
  location: "fsn1"
  volume_size_gb: 10
  always_on: false
  idle_timeout_minutes: 15
  keyboard_layout: "de"
  use_golden_image: false  # When true, boots from pre-baked Packer snapshot
  ssh_keys:
    - "your-hetzner-ssh-key-name"
  ssh_allowed_ips: []  # Add CIDRs e.g. ["203.0.113.50/32"] or leave empty to drop TCP 22

minecraft:
  server_type: "FABRIC"
  version: "26.3"  # renovate: datasource=mojang-java
  jvm_memory: "5G"
  motd: "Mine Your Own Bum - On-Demand Crossplay Server"
  max_players: 20
  difficulty: "normal"
  online_mode: true
  enforce_secure_profile: true
  whitelist_enabled: true
  whitelist:
    # Java players: username (e.g. "Steve") or UUID
    # Bedrock players: Floodgate UUID (format: 00000000-0000-0000-xxxx-xxxxxxxxxxxx derived from Xbox XUID)
    - "Steve"
    # - "00000000-0000-0000-0009-0123456789ab"  # Bedrock Gamertag
  ops:
    - "Steve"
    # - "00000000-0000-0000-0009-0123456789ab"  # Bedrock Gamertag
  modrinth_modpack: ""
  modrinth_projects:
    - "fabric-api"
    - "lithium"
    - "ferrite-core"
    - "krypton"
    - "carpet"
    - "geyser:beta"     # Continuous beta channel build required on Modrinth
    - "floodgate:beta"  # Continuous beta channel build required on Modrinth
  curseforge_projects: []
  rcon_startup_commands: []
  plugins: []

dns:
  enabled: false
  provider: "desec"  # Supported: "desec", "ionos", "hetzner"
  domain: "my-minecraft.dedyn.io"
  subname: "mc"
  ttl: 60

backup:
  enabled: false
  retention_count: 10  # Number of snapshots to retain (prunes older ones locally & in S3/R2)
  interval: "1h"       # Recurring snapshot interval while server is online
  initial_delay: "5m"  # Delay after boot before taking first snapshot

containers:
  minecraft_server: "itzg/minecraft-server:2026.10.0"  # renovate: datasource=docker depName=itzg/minecraft-server
  backup: "itzg/mc-backup:2026.10.1"                  # renovate: datasource=docker depName=itzg/mc-backup
  cloudflared: "cloudflare/cloudflared:2026.3.0"      # renovate: datasource=docker depName=cloudflare/cloudflared
  mc_agent: "ghcr.io/bumuellp/mc-agent:0.1.0"         # renovate: datasource=docker depName=ghcr.io/bumuellp/mc-agent

packer:
  arm_builder: "cax11"  # Model used to build ARM golden image snapshot
  x86_builder: "cpx12"  # Model used to build x86 golden image snapshot (min 40GB disk)
  fallback_locations: # Datacenter fallback order for builder VMs (snapshots are global)
    - "fsn1"
    - "nbg1"
    - "hel1"

discord:
  enabled: false
  # Optional: Separate #mc-commands (operational commands) from #mc-chat (/mc-say & live chat)
  command_channel_id: ""
  chat_channel_id: ""
  # Optional: Restrict /mc-start, /mc-stop, and admin commands to specific Discord user IDs.
  # Leave empty ([]) to allow all members with slash command access in your guild.
  allowed_user_ids: []
  # - "123456789012345678"
