---
server:
  server_type: "cax21"
  location: "fsn1"
  volume_size_gb: 10
  always_on: false
  idle_timeout_minutes: 15
  keyboard_layout: "de"
  ssh_keys:
    - "your-hetzner-ssh-key-name"
  ssh_allowed_ips: []  # Add CIDRs e.g. ["203.0.113.50/32"] or leave empty to drop TCP 22

minecraft:
  server_type: "FABRIC"
  version: "26.3"  # renovate: datasource=mojang-java
  jvm_memory: "6G"
  motd: "Mine Your Own Bum - On-Demand Crossplay Server"
  max_players: 20
  difficulty: "normal"
  whitelist_enabled: true
  whitelist:
    # Java players: username (e.g. "Steve") or UUID
    # Bedrock players: Floodgate UUID (format: 00000000-0000-0000-xxxx-xxxxxxxxxxxx derived from Xbox XUID)
    - "Steve"
    # - "00000000-0000-0000-0009-0123456789ab"  # Bedrock Gamertag
  ops:
    - "Steve"
    # - "00000000-0000-0000-0009-0123456789ab"  # Bedrock Gamertag
  modrinth_projects:
    - "fabric-api"
    - "lithium"
    - "ferrite-core"
    - "krypton"
    - "carpet"
    - "geyser"
    - "floodgate"
  plugins: []

dns:
  enabled: false
  provider: "desec"  # Supported: "desec", "ionos"
  domain: "my-minecraft.dedyn.io"
  subname: "mc"
  ttl: 60

backup:
  enabled: false
  retention_count: 10  # Number of snapshots to retain (prunes older ones locally & in S3/R2)
  interval: "1h"       # Recurring snapshot interval while server is online
  initial_delay: "5m"  # Delay after boot before taking first snapshot

discord:
  enabled: false
  # Optional: Restrict /mc-start, /mc-stop to specific Discord user IDs.
  # Leave empty ([]) to allow all members with slash command access in your guild.
  allowed_user_ids: []
  # - "123456789012345678"
