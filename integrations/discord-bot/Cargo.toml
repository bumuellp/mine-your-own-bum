[package]
name = "minecraft-discord-bot"
version = "0.1.0"
edition = "2024"
description = "Serverless Discord slash-command bot on Cloudflare Workers for Minecraft server management"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.9.0"
worker-macros = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "3.0.0", default-features = false }
hex = "0.4"
futures-util = { version = "0.3.0", default-features = false }
tokio = { version = "1.0", default-features = false, features = ["io-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false # Wrangler and Cloudflair workers require this: externref table required for catch wrappers
panic = "abort"
