[package]
name = "minecraft-discord-bot"
version = "0.1.0"
edition = "2024"
description = "Serverless Discord slash-command bot on Cloudflare Workers for Minecraft server management"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.7"
worker-macros = "0.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "3.0.0", default-features = false }
hex = "0.4"
futures-util = { version = "0.3.0", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
