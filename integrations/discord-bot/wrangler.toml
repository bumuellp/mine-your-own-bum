name = "mine-your-own-bum"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

[observability.logs]
enabled = true
invocation_logs = true

# Optional: Bind your Cloudflare Workers VPC Service pointing to mc-agent via cloudflared.
# Uncomment and set your service_id from `npx wrangler vpc service create mc-agent ...`:
# [[vpc_services]]
# binding = "MC_AGENT"
# service_id = "<YOUR_VPC_SERVICE_ID>"
# remote = true
