[package]
name = "mc-agent"
version = "0.1.0"
edition = "2024"
description = "Lightweight sidecar agent for Minecraft RCON management, host telemetry, and loader-agnostic Discord chat bridging"
license = "MIT"

[dependencies]
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
