---
name: Start Minecraft Server

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-server-state
  cancel-in-progress: false

jobs:
  start:
    name: Provision & Start Server
    if: github.repository != 'bumuellp/mine-your-own-bum'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version_file: .tofu-version

      - name: Decrypt Secrets
        uses: bumuellp/lights-camera-bum-action/decrypt-sops@a9266088302dbbda63132cc9705b14e436c957fd # v1.7.0
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          file: config/secrets.enc.yaml
          output: config/secrets.yaml

      - name: Validate Pre-flight Credentials & Configuration
        run: ./scripts/preflight.sh

      - name: Parse S3 Backend Configuration
        id: s3_cfg
        run: |
          SECRETS_FILE="config/secrets.yaml"
          [ -f "$SECRETS_FILE" ] || SECRETS_FILE="config/secrets.example.yaml"

          get_sec() {
            awk -v k="$1" '
              $1 == k ":" {
                sub(/^[^:]*:[ \t]*/, "")
                sub(/#.*$/, "")
                gsub(/^[ \t]+|[ \t]+$/, "")
                gsub(/^["\x27]|["\x27]$/, "")
                print
                exit
              }
            ' "$SECRETS_FILE"
          }

          S3_BUCKET="$(get_sec s3_bucket)"
          S3_ENDPOINT="$(get_sec s3_endpoint)"
          S3_ACCESS_KEY="$(get_sec s3_access_key)"
          S3_SECRET_KEY="$(get_sec s3_secret_key)"
          STATE_PASSPHRASE="$(get_sec state_encryption_passphrase)"

          if [ -n "$STATE_PASSPHRASE" ]; then
            echo "::add-mask::$STATE_PASSPHRASE"
            echo "TF_VAR_state_encryption_passphrase=$STATE_PASSPHRASE" >> "$GITHUB_ENV"
          fi

          if [ -n "$S3_ACCESS_KEY" ]; then
            echo "::add-mask::$S3_ACCESS_KEY"
            echo "AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY" >> "$GITHUB_ENV"
          fi

          if [ -n "$S3_SECRET_KEY" ]; then
            echo "::add-mask::$S3_SECRET_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$S3_SECRET_KEY" >> "$GITHUB_ENV"
          fi

          echo "bucket=$S3_BUCKET" >> "$GITHUB_OUTPUT"
          echo "endpoint=$S3_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "access_key=$S3_ACCESS_KEY" >> "$GITHUB_OUTPUT"
          echo "secret_key=$S3_SECRET_KEY" >> "$GITHUB_OUTPUT"

      - name: Initialize OpenTofu Backend
        uses: bumuellp/lights-camera-bum-action/setup-tofu-backend@a9266088302dbbda63132cc9705b14e436c957fd # v1.7.0
        with:
          working-directory: iac
          bucket: ${{ steps.s3_cfg.outputs.bucket }}
          endpoint: ${{ steps.s3_cfg.outputs.endpoint }}
          key: mine-your-own-bum/terraform.tfstate
          access-key: ${{ steps.s3_cfg.outputs.access_key }}
          secret-key: ${{ steps.s3_cfg.outputs.secret_key }}

      - name: OpenTofu Apply (Provision Server)
        id: tofu_apply
        working-directory: iac
        env:
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_github_pat: ${{ secrets.PAT_WATCHDOG || '' }}
        run: |
          # Ensure persistent storage volume exists in state before provisioning compute and attachments
          tofu apply -target=module.volume -auto-approve
          tofu apply -auto-approve

          DNS_TOKEN=$(tofu output -raw dns_token)
          if [ -n "$DNS_TOKEN" ]; then
            echo "::add-mask::$DNS_TOKEN"
          fi

          cat << EOF >> "$GITHUB_OUTPUT"
          ipv4=$(tofu output -raw server_ipv4)
          ipv6=$(tofu output -raw server_ipv6)
          dns_enabled=$(tofu output -raw dns_enabled)
          dns_provider=$(tofu output -raw dns_provider)
          dns_domain=$(tofu output -raw dns_domain)
          dns_subname=$(tofu output -raw dns_subname)
          dns_ttl=$(tofu output -raw dns_ttl)
          dns_fqdn=$(tofu output -raw dns_fqdn)
          dns_token=$DNS_TOKEN
          EOF

      - name: Sync DNS IPv4 Record
        if: steps.tofu_apply.outputs.dns_enabled == 'true'
        uses: bumuellp/lights-camera-bum-action/sync-dns-record@a9266088302dbbda63132cc9705b14e436c957fd # v1.7.0
        with:
          provider: ${{ steps.tofu_apply.outputs.dns_provider }}
          token: ${{ steps.tofu_apply.outputs.dns_token }}
          domain: ${{ steps.tofu_apply.outputs.dns_domain }}
          subname: ${{ steps.tofu_apply.outputs.dns_subname }}
          type: A
          records: ${{ steps.tofu_apply.outputs.ipv4 }}
          ttl: ${{ steps.tofu_apply.outputs.dns_ttl }}
          action: sync

      - name: Sync DNS IPv6 Record
        if: steps.tofu_apply.outputs.dns_enabled == 'true' && steps.tofu_apply.outputs.ipv6 != ''
        uses: bumuellp/lights-camera-bum-action/sync-dns-record@a9266088302dbbda63132cc9705b14e436c957fd # v1.7.0
        with:
          provider: ${{ steps.tofu_apply.outputs.dns_provider }}
          token: ${{ steps.tofu_apply.outputs.dns_token }}
          domain: ${{ steps.tofu_apply.outputs.dns_domain }}
          subname: ${{ steps.tofu_apply.outputs.dns_subname }}
          type: AAAA
          records: ${{ steps.tofu_apply.outputs.ipv6 }}
          ttl: ${{ steps.tofu_apply.outputs.dns_ttl }}
          action: sync

      - name: Verify Server Readiness & Healthcheck
        timeout-minutes: 5
        run: |
          SERVER_IP="${{ steps.tofu_apply.outputs.ipv4 }}"
          echo "Waiting for Minecraft server on $SERVER_IP:25565 to become reachable..."

          MAX_ATTEMPTS=30
          ATTEMPT=0
          ONLINE=false

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            if nc -z -w 3 "$SERVER_IP" 25565 2>/dev/null; then
              echo "::notice ::Minecraft server is ONLINE and accepting connections at $SERVER_IP:25565!"
              ONLINE=true
              break
            fi
            echo "Waiting for Minecraft engine to initialize... (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
            sleep 6
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$ONLINE" != "true" ]; then
            echo "::error ::Minecraft server failed to respond on port 25565 within timeout window."
            exit 1
          fi

      - name: Generate GitHub Actions Step Summary
        run: |
          IPV4="${{ steps.tofu_apply.outputs.ipv4 }}"
          IPV6="${{ steps.tofu_apply.outputs.ipv6 }}"
          DNS_ENABLED="${{ steps.tofu_apply.outputs.dns_enabled }}"
          FQDN="${{ steps.tofu_apply.outputs.dns_fqdn }}"

          if [ "$DNS_ENABLED" = "true" ] && [ -n "$FQDN" ]; then
            JAVA_HOST="$FQDN"
            BEDROCK_HOST="$FQDN"
            DISPLAY_DOMAIN="$FQDN"
          else
            JAVA_HOST="$IPV4"
            BEDROCK_HOST="$IPV4"
            DISPLAY_DOMAIN="*Not configured (using raw IP)*"
          fi

          IPV6_ROW=""
          if [ -n "$IPV6" ]; then
            IPV6_ROW="| **IPv6 Address** | \`$IPV6\` |"
          fi

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🎮 Minecraft Server Status: **ONLINE**

          The ephemeral cloud server has been provisioned and persistent storage attached.

          ### 🌐 Connection Information
          | Parameter | Value |
          | :--- | :--- |
          | **Domain / FQDN** | \`$DISPLAY_DOMAIN\` |
          | **Java Edition** | \`$JAVA_HOST:25565\` |
          | **Bedrock Edition** | \`$BEDROCK_HOST:19132\` (Port: \`19132\`) |
          | **IPv4 Address** | \`$IPV4\` |
          $IPV6_ROW

          > [!NOTE]
          > Because compute instances are completely ephemeral, **every boot is a fresh boot**.
          > Docker and Minecraft containers initialize and verify runtime files upon startup.
          > It may take **1 to 2 minutes** before the server begins answering player pings on port 25565 / 19132.

          ### 🛑 Shutdown & Idle Watchdog
          - **Automatic Idle Stop**: If no players are online for the configured idle threshold,
            the server automatically saves world data and terminates the VM to prevent cloud costs.
          - **Manual Stop**: Run the **Stop Minecraft Server** workflow whenever you finish playing.
          - **Data Retention**: World saves, player data, and configurations are permanently stored
            on the persistent Hetzner volume and survive VM destruction.
          EOF
