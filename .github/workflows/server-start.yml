---
name: Start Minecraft Server

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-server-state
  cancel-in-progress: false

jobs:
  start:
    name: Provision & Start Server
    if: github.repository != 'bumuellp/mine-your-own-bum'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse Settings
        id: cfg
        uses: bumuellp/lights-camera-bum-action/parse-config@5ddbb7a43c1bdab312398f243434dd040507c5a7 # v1.13.0
        with:
          file: config/settings.yaml
          fallback-file: config/settings.example.yaml
          keys: |
            server.location
            server.server_type
            server.fallback_server_types

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .tofu-version

      - name: Decrypt Secrets
        id: sec
        uses: bumuellp/lights-camera-bum-action/decrypt-sops@5ddbb7a43c1bdab312398f243434dd040507c5a7 # v1.13.0
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          file: config/secrets.enc.yaml
          output: config/secrets.yaml
          keys: |
            s3_bucket
            s3_endpoint
            s3_access_key
            s3_secret_key
            state_encryption_passphrase
            hcloud_token

      - name: Resolve Server Placement
        id: placement
        uses: bumuellp/lights-camera-bum-action/resolve-hcloud-placement@5ddbb7a43c1bdab312398f243434dd040507c5a7 # v1.13.0
        with:
          token: ${{ fromJSON(steps.sec.outputs.json).hcloud_token }}
          server-types: >-
            ${{ fromJSON(steps.cfg.outputs.json)['server.server_type'] }},
            ${{ fromJSON(steps.cfg.outputs.json)['server.fallback_server_types'] }}
          locations: ${{ fromJSON(steps.cfg.outputs.json)['server.location'] || 'fsn1' }}

      - name: Validate Pre-flight Credentials & Configuration
        run: ./scripts/preflight.sh
        env:
          TF_VAR_server_type: ${{ steps.placement.outputs.server-type }}

      - name: Initialize OpenTofu Backend
        uses: bumuellp/lights-camera-bum-action/setup-tofu-backend@5ddbb7a43c1bdab312398f243434dd040507c5a7 # v1.13.0
        with:
          working-directory: iac
          bucket: ${{ fromJSON(steps.sec.outputs.json).s3_bucket }}
          endpoint: ${{ fromJSON(steps.sec.outputs.json).s3_endpoint }}
          key: mine-your-own-bum/terraform.tfstate
          access-key: ${{ fromJSON(steps.sec.outputs.json).s3_access_key }}
          secret-key: ${{ fromJSON(steps.sec.outputs.json).s3_secret_key }}
          state-passphrase: ${{ fromJSON(steps.sec.outputs.json).state_encryption_passphrase || '' }}

      - name: OpenTofu Apply (Provision Server)
        id: tofu_apply
        env:
          TF_VAR_server_type: ${{ steps.placement.outputs.server-type }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_github_pat: ${{ secrets.PAT_WATCHDOG || '' }}
        run: .github/scripts/provision-server.sh

      - name: Sync DNS IPv4 Record
        if: steps.tofu_apply.outputs.dns_enabled == 'true'
        uses: bumuellp/lights-camera-bum-action/sync-dns-record@5ddbb7a43c1bdab312398f243434dd040507c5a7 # v1.13.0
        with:
          provider: ${{ steps.tofu_apply.outputs.dns_provider }}
          token: ${{ steps.tofu_apply.outputs.dns_token }}
          domain: ${{ steps.tofu_apply.outputs.dns_domain }}
          subname: ${{ steps.tofu_apply.outputs.dns_subname }}
          type: A
          records: ${{ steps.tofu_apply.outputs.ipv4 }}
          ttl: ${{ steps.tofu_apply.outputs.dns_ttl }}
          action: sync

      - name: Sync DNS IPv6 Record
        if: steps.tofu_apply.outputs.dns_enabled == 'true' && steps.tofu_apply.outputs.ipv6 != ''
        uses: bumuellp/lights-camera-bum-action/sync-dns-record@5ddbb7a43c1bdab312398f243434dd040507c5a7 # v1.13.0
        with:
          provider: ${{ steps.tofu_apply.outputs.dns_provider }}
          token: ${{ steps.tofu_apply.outputs.dns_token }}
          domain: ${{ steps.tofu_apply.outputs.dns_domain }}
          subname: ${{ steps.tofu_apply.outputs.dns_subname }}
          type: AAAA
          records: ${{ steps.tofu_apply.outputs.ipv6 }}
          ttl: ${{ steps.tofu_apply.outputs.dns_ttl }}
          action: sync

      - name: Verify Server Readiness & Healthcheck
        timeout-minutes: 6
        env:
          SERVER_IP: ${{ steps.tofu_apply.outputs.ipv4 }}
        run: .github/scripts/verify-server-readiness.sh

      - name: Generate GitHub Actions Step Summary
        env:
          IPV4: ${{ steps.tofu_apply.outputs.ipv4 }}
          IPV6: ${{ steps.tofu_apply.outputs.ipv6 }}
          DNS_ENABLED: ${{ steps.tofu_apply.outputs.dns_enabled }}
          FQDN: ${{ steps.tofu_apply.outputs.dns_fqdn }}
          ALREADY_RUNNING: ${{ steps.tofu_apply.outputs.already_running }}
          SERVER_TYPE_VAL: ${{ steps.tofu_apply.outputs.server_type }}
          SERVER_ARCH_VAL: ${{ steps.tofu_apply.outputs.server_arch }}
        run: .github/scripts/generate-start-summary.sh

      - name: Scrub Plaintext Secrets
        if: always()
        run: rm -f config/secrets.yaml
