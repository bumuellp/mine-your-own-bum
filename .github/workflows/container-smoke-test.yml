---
name: Container Smoke Test

'on':
  push:
    branches: [main]
    paths:
      - 'iac/templates/docker-compose.yml.tftpl'
      - 'iac/templates/cloud-init.yaml.tftpl'
      - 'config/settings.yaml'
      - 'config/settings.example.yaml'
      - 'tests/smoke-test/**'
      - '.tofu-version'
      - '.github/scripts/container-smoke-test.sh'
      - '.github/workflows/container-smoke-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'iac/templates/docker-compose.yml.tftpl'
      - 'iac/templates/cloud-init.yaml.tftpl'
      - 'config/settings.yaml'
      - 'config/settings.example.yaml'
      - 'tests/smoke-test/**'
      - '.tofu-version'
      - '.github/scripts/container-smoke-test.sh'
      - '.github/workflows/container-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Verify Minecraft Container Stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .tofu-version

      - name: Cache OpenTofu Provider Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/tofu-plugin-cache
          key: tofu-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/smoke-test/*.tf', '.tofu-version') }}
          restore-keys: |
            tofu-smoke-${{ runner.os }}-${{ runner.arch }}-

      - name: Run Container Smoke Test
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
        run: .github/scripts/container-smoke-test.sh
