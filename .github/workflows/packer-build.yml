---
name: Build Golden Machine Image

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packer/**'
      - 'config/settings.yaml'
      - 'config/settings.example.yaml'
      - '.github/workflows/packer-build.yml'

permissions:
  contents: read

concurrency:
  group: packer-golden-image
  cancel-in-progress: false

jobs:
  build:
    name: Build & Rotate Golden Image (${{ matrix.arch }})
    if: github.repository != 'bumuellp/mine-your-own-bum'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, x86]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse Settings
        id: cfg
        uses: bumuellp/lights-camera-bum-action/parse-config@e13ffa1fb937ece0ff0fb24c0d9b538b80c3de2e # v1.11.1
        with:
          file: config/settings.yaml
          fallback-file: config/settings.example.yaml
          keys: |
            server.location
            server.keyboard_layout
            containers.minecraft_server
            containers.backup
            containers.mc_agent
            containers.cloudflared
            packer.arm_builder
            packer.x86_builder
            packer.fallback_locations

      - name: Decrypt Secrets
        id: sec
        uses: bumuellp/lights-camera-bum-action/decrypt-sops@e13ffa1fb937ece0ff0fb24c0d9b538b80c3de2e # v1.11.1
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          file: config/secrets.enc.yaml
          keys: |
            hcloud_token

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 'v1.16.2'

      - name: Initialize Packer Plugins
        run: packer init packer/minecraft.pkr.hcl

      - name: Resolve Available Builder Location
        id: placement
        uses: bumuellp/lights-camera-bum-action/resolve-hcloud-placement@e13ffa1fb937ece0ff0fb24c0d9b538b80c3de2e # v1.11.1
        with:
          token: ${{ fromJSON(steps.sec.outputs.json).hcloud_token }}
          server-types: >-
            ${{ matrix.arch == 'arm'
                && (fromJSON(steps.cfg.outputs.json)['packer.arm_builder'] || 'cax11')
                || (fromJSON(steps.cfg.outputs.json)['packer.x86_builder'] || 'cpx12') }}
          locations: ${{ toJSON(fromJSON(steps.cfg.outputs.json)['packer.fallback_locations']) || '["fsn1", "nbg1", "hel1"]' }}

      - name: Build Golden Image
        env:
          PKR_VAR_hcloud_token: ${{ fromJSON(steps.sec.outputs.json).hcloud_token }}
          PKR_VAR_location: ${{ steps.placement.outputs.location }}
          PKR_VAR_architecture: ${{ matrix.arch }}
          PKR_VAR_server_type: ${{ steps.placement.outputs.server-type }}
          PKR_VAR_keyboard_layout: ${{ fromJSON(steps.cfg.outputs.json)['server.keyboard_layout'] || 'de' }}
          PKR_VAR_minecraft_image: ${{ fromJSON(steps.cfg.outputs.json)['containers.minecraft_server'] }}
          PKR_VAR_backup_image: ${{ fromJSON(steps.cfg.outputs.json)['containers.backup'] }}
          PKR_VAR_mc_agent_image: ${{ fromJSON(steps.cfg.outputs.json)['containers.mc_agent'] || '' }}
          PKR_VAR_cloudflared_image: ${{ fromJSON(steps.cfg.outputs.json)['containers.cloudflared'] || '' }}
        run: |
          packer build -color=false packer/minecraft.pkr.hcl

      - name: Rotate Old Snapshots
        uses: bumuellp/lights-camera-bum-action/rotate-hcloud-snapshots@e13ffa1fb937ece0ff0fb24c0d9b538b80c3de2e # v1.11.1
        with:
          token: ${{ fromJSON(steps.sec.outputs.json).hcloud_token }}
          label-selector: 'role=minecraft-golden-image,architecture=${{ matrix.arch }}'
          keep: '1'

      - name: Delete Stale Snapshots on Build Failure
        if: failure()
        uses: bumuellp/lights-camera-bum-action/rotate-hcloud-snapshots@e13ffa1fb937ece0ff0fb24c0d9b538b80c3de2e # v1.11.1
        with:
          token: ${{ fromJSON(steps.sec.outputs.json).hcloud_token }}
          label-selector: 'role=minecraft-golden-image,architecture=${{ matrix.arch }}'
          keep: '0'
