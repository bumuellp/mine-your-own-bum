---
name: Stop Minecraft Server

'on':
  workflow_dispatch:
  repository_dispatch:
    types: [minecraft-idle-stop, stop-minecraft-server]

permissions:
  contents: read

concurrency:
  group: minecraft-server-state
  cancel-in-progress: false

jobs:
  stop:
    name: Teardown & Destroy Server
    if: github.repository != 'bumuellp/mine-your-own-bum'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version_file: .tofu-version

      - name: Decrypt Secrets
        id: sec
        uses: bumuellp/lights-camera-bum-action/decrypt-sops@bb6e472c54d235d27b4c9451921820bac9ad2815
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          file: config/secrets.enc.yaml
          output: config/secrets.yaml
          keys: |
            s3_bucket
            s3_endpoint
            s3_access_key
            s3_secret_key
            state_encryption_passphrase

      - name: Initialize OpenTofu Backend
        uses: bumuellp/lights-camera-bum-action/setup-tofu-backend@bb6e472c54d235d27b4c9451921820bac9ad2815
        with:
          working-directory: iac
          bucket: ${{ fromJSON(steps.sec.outputs.json).s3_bucket }}
          endpoint: ${{ fromJSON(steps.sec.outputs.json).s3_endpoint }}
          key: mine-your-own-bum/terraform.tfstate
          access-key: ${{ fromJSON(steps.sec.outputs.json).s3_access_key }}
          secret-key: ${{ fromJSON(steps.sec.outputs.json).s3_secret_key }}
          state-passphrase: ${{ fromJSON(steps.sec.outputs.json).state_encryption_passphrase || '' }}

      - name: Refresh State & Parse DNS Configuration
        id: dns_cfg
        working-directory: iac
        env:
          TF_VAR_github_repository: ${{ github.repository }}
        run: |
          tofu refresh

          ALREADY_STOPPED=false
          if ! tofu state list module.server.hcloud_server.this >/dev/null 2>&1; then
            ALREADY_STOPPED=true
            echo "Minecraft server instance is already absent from remote state."
          fi

          TOFU_OUT=$(tofu output -json)
          SERVER_ID=$(echo "$TOFU_OUT" | jq -r '.server_id.value // ""')
          DNS_TOKEN=$(echo "$TOFU_OUT" | jq -r '.dns_token.value // ""')
          if [ -n "$DNS_TOKEN" ]; then
            echo "::add-mask::$DNS_TOKEN"
          fi

          cat << EOF >> "$GITHUB_OUTPUT"
          already_stopped=$ALREADY_STOPPED
          server_id=$SERVER_ID
          enabled=$(echo "$TOFU_OUT" | jq -r '.dns_enabled.value // false')
          provider=$(echo "$TOFU_OUT" | jq -r '.dns_provider.value // ""')
          domain=$(echo "$TOFU_OUT" | jq -r '.dns_domain.value // ""')
          subname=$(echo "$TOFU_OUT" | jq -r '.dns_subname.value // ""')
          fqdn=$(echo "$TOFU_OUT" | jq -r '.dns_fqdn.value // ""')
          dns_token=$DNS_TOKEN
          EOF

      - name: Delete DNS IPv4 Record
        if: steps.dns_cfg.outputs.enabled == 'true'
        uses: bumuellp/lights-camera-bum-action/sync-dns-record@a21ac9a3bce793328fdf2492390dcc7d3b95573a # v1.8.0
        with:
          provider: ${{ steps.dns_cfg.outputs.provider }}
          token: ${{ steps.dns_cfg.outputs.dns_token }}
          domain: ${{ steps.dns_cfg.outputs.domain }}
          subname: ${{ steps.dns_cfg.outputs.subname }}
          type: A
          action: delete

      - name: Delete DNS IPv6 Record
        if: steps.dns_cfg.outputs.enabled == 'true'
        uses: bumuellp/lights-camera-bum-action/sync-dns-record@a21ac9a3bce793328fdf2492390dcc7d3b95573a # v1.8.0
        with:
          provider: ${{ steps.dns_cfg.outputs.provider }}
          token: ${{ steps.dns_cfg.outputs.dns_token }}
          domain: ${{ steps.dns_cfg.outputs.domain }}
          subname: ${{ steps.dns_cfg.outputs.subname }}
          type: AAAA
          action: delete

      - name: Graceful Server ACPI Shutdown
        if: steps.dns_cfg.outputs.already_stopped != 'true'
        continue-on-error: true
        run: .github/scripts/graceful-shutdown.sh
        env:
          SERVER_ID: ${{ steps.dns_cfg.outputs.server_id }}

      - name: OpenTofu Destroy Server (Targeted)
        if: steps.dns_cfg.outputs.already_stopped != 'true'
        working-directory: iac
        env:
          TF_VAR_github_repository: ${{ github.repository }}
        run: |
          # Destroy only the ephemeral compute server, preserving volume and firewall
          tofu destroy -target=module.server -auto-approve

      - name: Generate GitHub Actions Step Summary
        run: |
          TRIGGER_EVENT="${{ github.event_name }}"
          FQDN="${{ steps.dns_cfg.outputs.fqdn }}"
          ALREADY_STOPPED="${{ steps.dns_cfg.outputs.already_stopped }}"

          STOP_REASON="The server was manually shut down via workflow dispatch."
          if [ "$ALREADY_STOPPED" = "true" ]; then
            STOP_REASON="The server was already offline; no compute teardown was needed."
          elif [ "$TRIGGER_EVENT" = "repository_dispatch" ]; then
            STOP_REASON="The server was automatically shut down by the **Idle Watchdog** because no players were active."
          fi

          DNS_ROW=""
          if [ -n "$FQDN" ]; then
            DNS_ROW="- **DNS Record**: \`$FQDN\` entry removed."
          fi

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🛑 Minecraft Server Status: **OFFLINE**

          $STOP_REASON

          ### 💾 State Preservation
          - **Compute Instance**: Terminated to halt compute charges.
          - **Persistent Volume**: Safe & retained on Hetzner Cloud.
          $DNS_ROW

          To play again, trigger the **Start Minecraft Server** workflow.
          EOF
