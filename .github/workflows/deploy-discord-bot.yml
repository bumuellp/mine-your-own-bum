---
name: Deploy Discord Bot

"on":
  push:
    branches: [main]
    paths:
      - "integrations/discord-bot/**"
      - ".github/workflows/deploy-discord-bot.yml"
      - "config/settings.yaml"
      - "config/secrets.enc.yaml"
  pull_request:
    branches: [main]
    paths:
      - "integrations/discord-bot/**"
      - ".github/workflows/deploy-discord-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-discord-bot
  cancel-in-progress: false

jobs:
  lint:
    name: Rust Lint & Verify (Check-Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup, Lint & Test Rust Crate
        uses: bumuellp/lights-camera-bum-action/setup-rust@34fd1ec3bc1c86211628dd1a8ba7cbd7da0a9594 # v1.15.1
        with:
          components: clippy, rustfmt
          workspaces: integrations/discord-bot
          run-fmt: "true"
          run-clippy: "true"
          run-test: "true"

  deploy-worker:
    name: Deploy Cloudflare Worker & Sync Commands
    needs: lint
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.repository != 'bumuellp/mine-your-own-bum'
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse Settings
        id: cfg
        uses: bumuellp/lights-camera-bum-action/parse-config@34fd1ec3bc1c86211628dd1a8ba7cbd7da0a9594 # v1.15.1
        with:
          file: config/settings.yaml
          fallback-file: config/settings.example.yaml
          keys: |
            discord.enabled
            discord.allowed_user_ids
            discord.command_channel_id
            discord.chat_channel_id
            dns.subname
            dns.domain
            server.location
            minecraft.server_type
            minecraft.version
            minecraft.modrinth_modpack
            minecraft.modrinth_projects
            minecraft.curseforge_projects

      - name: Decrypt Secrets (SOPS)
        id: sec
        uses: bumuellp/lights-camera-bum-action/decrypt-sops@34fd1ec3bc1c86211628dd1a8ba7cbd7da0a9594 # v1.15.1
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          file: config/secrets.enc.yaml
          keys: |
            cloudflare_api_token
            discord_public_key
            discord_application_id
            discord_bot_token
            github_pat
            agent_shared_secret

      - name: Skip Notice
        if: |
          fromJSON(steps.cfg.outputs.json)['discord.enabled'] != 'true' ||
          (env.CF_API_TOKEN == '' &&
           (fromJSON(steps.sec.outputs.json)['cloudflare_api_token'] == '' ||
            fromJSON(steps.sec.outputs.json)['cloudflare_api_token'] == null))
        run: >-
          echo "::notice ::Discord bot disabled in settings or Cloudflare credentials missing. Skipping deployment."

      - name: Resolve Modrinth Project Sides (Client vs Server)
        id: mods
        if: fromJSON(steps.cfg.outputs.json)['discord.enabled'] == 'true'
        run: ./scripts/resolve-modrinth-sides.sh --github-output

      - name: Setup Rust Toolchain
        if: |
          fromJSON(steps.cfg.outputs.json)['discord.enabled'] == 'true' &&
          (env.CF_API_TOKEN != '' ||
           (fromJSON(steps.sec.outputs.json)['cloudflare_api_token'] != '' &&
            fromJSON(steps.sec.outputs.json)['cloudflare_api_token'] != null))
        uses: bumuellp/lights-camera-bum-action/setup-rust@34fd1ec3bc1c86211628dd1a8ba7cbd7da0a9594 # v1.15.1
        with:
          targets: wasm32-unknown-unknown
          install-worker-build: true
          workspaces: integrations/discord-bot

      - name: Deploy Worker via Cloudflare Action
        if: |
          fromJSON(steps.cfg.outputs.json)['discord.enabled'] == 'true' &&
          (env.CF_API_TOKEN != '' ||
           (fromJSON(steps.sec.outputs.json)['cloudflare_api_token'] != '' &&
            fromJSON(steps.sec.outputs.json)['cloudflare_api_token'] != null))
        uses: bumuellp/lights-camera-bum-action/deploy-worker@34fd1ec3bc1c86211628dd1a8ba7cbd7da0a9594 # v1.15.1
        with:
          api-token: ${{ env.CF_API_TOKEN || fromJSON(steps.sec.outputs.json)['cloudflare_api_token'] }}
          working-directory: integrations/discord-bot
          vars: |
            GITHUB_OWNER
            GITHUB_REPO
            SERVER_FQDN
            SERVER_LOCATION
            COMMAND_CHANNEL_ID
            CHAT_CHANNEL_ID
            MC_SERVER_TYPE
            MC_VERSION
            MC_MODLOADER
            MC_MODRINTH_MODPACK
            MC_CLIENT_REQUIRED_MODS
            MC_CLIENT_OPTIONAL_MODS
            MC_SERVER_ONLY_MODS
            MC_CURSEFORGE_PROJECTS
          secrets: |
            DISCORD_PUBLIC_KEY
            DISCORD_APPLICATION_ID
            GITHUB_PAT
            ALLOWED_USER_IDS
            AGENT_SHARED_SECRET
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          SERVER_FQDN: >-
            ${{ fromJSON(steps.cfg.outputs.json)['dns.subname'] != '' &&
                format('{0}.{1}', fromJSON(steps.cfg.outputs.json)['dns.subname'], fromJSON(steps.cfg.outputs.json)['dns.domain']) ||
                fromJSON(steps.cfg.outputs.json)['dns.domain'] }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY || fromJSON(steps.sec.outputs.json)['discord_public_key'] }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID || fromJSON(steps.sec.outputs.json)['discord_application_id'] }}
          GITHUB_PAT: ${{ secrets.PAT_WATCHDOG || fromJSON(steps.sec.outputs.json)['github_pat'] }}
          ALLOWED_USER_IDS: ${{ fromJSON(steps.cfg.outputs.json)['discord.allowed_user_ids'] || '' }}
          SERVER_LOCATION: ${{ fromJSON(steps.cfg.outputs.json)['server.location'] || 'fsn1' }}
          COMMAND_CHANNEL_ID: ${{ fromJSON(steps.cfg.outputs.json)['discord.command_channel_id'] || '' }}
          CHAT_CHANNEL_ID: ${{ fromJSON(steps.cfg.outputs.json)['discord.chat_channel_id'] || '' }}
          MC_SERVER_TYPE: ${{ fromJSON(steps.cfg.outputs.json)['minecraft.server_type'] || 'FABRIC' }}
          MC_VERSION: ${{ fromJSON(steps.cfg.outputs.json)['minecraft.version'] || '' }}
          MC_MODLOADER: ${{ steps.mods.outputs.modloader || '' }}
          MC_MODRINTH_MODPACK: ${{ fromJSON(steps.cfg.outputs.json)['minecraft.modrinth_modpack'] || '' }}
          MC_CLIENT_REQUIRED_MODS: ${{ steps.mods.outputs.client_required_mods || '' }}
          MC_CLIENT_OPTIONAL_MODS: ${{ steps.mods.outputs.client_optional_mods || '' }}
          MC_SERVER_ONLY_MODS: ${{ steps.mods.outputs.server_only_mods || '' }}
          MC_CURSEFORGE_PROJECTS: ${{ fromJSON(steps.cfg.outputs.json)['minecraft.curseforge_projects'] || '' }}
          AGENT_SHARED_SECRET: ${{ secrets.AGENT_SHARED_SECRET || fromJSON(steps.sec.outputs.json)['agent_shared_secret'] || '' }}

      - name: Register Slash Commands with Discord REST API
        if: |
          fromJSON(steps.cfg.outputs.json)['discord.enabled'] == 'true' &&
          (env.DISCORD_BOT_TOKEN != '' ||
           (fromJSON(steps.sec.outputs.json)['discord_bot_token'] != '' &&
            fromJSON(steps.sec.outputs.json)['discord_bot_token'] != null))
        working-directory: integrations/discord-bot
        env:
          DISCORD_BOT_TOKEN: ${{ env.DISCORD_BOT_TOKEN || fromJSON(steps.sec.outputs.json)['discord_bot_token'] }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID || fromJSON(steps.sec.outputs.json)['discord_application_id'] }}
        run: ./scripts/register-commands.sh
