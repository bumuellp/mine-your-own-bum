---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/bumuellp/cabumtain-hook
    rev: v1.5.0
    hooks:
      - id: commit-msg
      - id: secret-scan
      - id: shell-lint
      - id: yaml-xml-lint
      - id: trivy-config
      - id: trivy-fs
      - id: tag-immutability-guard
      - id: tofu-fmt
